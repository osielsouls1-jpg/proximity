<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Proximity — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--pink:#ff6b9d;--purple:#a78bfa;--green:#34d399;--bg:#0a0118;--bg2:#1a0533;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
  .g1{top:-100px;right:-100px;width:400px;height:400px;background:rgba(255,107,157,0.2);}
  .g2{bottom:0;left:-100px;width:350px;height:350px;background:rgba(167,139,250,0.15);}
  .card{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:28px;padding:40px;}
  .logo{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px;display:block;text-decoration:none;}
  .tagline{text-align:center;opacity:0.5;font-size:13px;margin-bottom:32px;}
  .tabs{display:flex;background:rgba(255,255,255,0.06);border-radius:16px;padding:4px;margin-bottom:28px;}
  .tab{flex:1;padding:10px;text-align:center;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;color:rgba(255,255,255,0.5);transition:all 0.2s;}
  .tab.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:600;opacity:0.6;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;}
  input,select{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;color:#fff;font-family:inherit;font-size:15px;outline:none;transition:border-color 0.2s;}
  input:focus,select:focus{border-color:var(--purple);}
  select option{background:#1a0533;}
  .emoji-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .emoji-btn{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);font-size:22px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
  .emoji-btn.active{border-color:var(--purple);background:rgba(167,139,250,0.2);}
  .btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:16px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;margin-top:8px;transition:transform 0.2s;box-shadow:0 8px 24px rgba(255,107,157,0.3);}
  .btn:hover{transform:scale(1.02);}
  .btn:disabled{opacity:0.6;transform:none;}
  .err{background:rgba(255,107,107,0.15);border:1px solid rgba(255,107,107,0.3);border-radius:12px;padding:12px 16px;font-size:14px;color:#ff9090;margin-bottom:16px;display:none;}
  .err.show{display:block;}
  .back{display:block;text-align:center;color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;margin-top:20px;}
  .back:hover{color:#fff;}
  #signup-extra{display:none;}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="card">
  <a href="/" class="logo">proximity</a>
  <p class="tagline">Dating, but you have to find each other.</p>

  <div class="tabs">
    <div class="tab active" onclick="setTab('login')">Sign in</div>
    <div class="tab" onclick="setTab('signup')">Create account</div>
  </div>

  <div class="err" id="err"></div>

  <form id="form" onsubmit="submit(event)">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6"/>
    </div>

    <div id="signup-extra">
      <div class="field">
        <label>Your name</label>
        <input type="text" id="name" placeholder="First name"/>
      </div>
      <div class="field" style="display:flex;gap:12px;">
        <div style="flex:1;">
          <label>Age</label>
          <input type="number" id="age" placeholder="25" min="18" max="99"/>
        </div>
        <div style="flex:1;">
          <label>Mode</label>
          <select id="mode">
            <option value="dating">Dating 💕</option>
            <option value="friends">Friends 🤝</option>
            <option value="both">Both ✨</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Pick your vibe</label>
        <div class="emoji-row" id="emoji-row">
          <div class="emoji-btn active" data-e="😊" onclick="pickEmoji(this)">😊</div>
          <div class="emoji-btn" data-e="☕" onclick="pickEmoji(this)">☕</div>
          <div class="emoji-btn" data-e="🍕" onclick="pickEmoji(this)">🍕</div>
          <div class="emoji-btn" data-e="🎨" onclick="pickEmoji(this)">🎨</div>
          <div class="emoji-btn" data-e="🎸" onclick="pickEmoji(this)">🎸</div>
          <div class="emoji-btn" data-e="🏄" onclick="pickEmoji(this)">🏄</div>
          <div class="emoji-btn" data-e="📚" onclick="pickEmoji(this)">📚</div>
          <div class="emoji-btn" data-e="🌮" onclick="pickEmoji(this)">🌮</div>
          <div class="emoji-btn" data-e="🐶" onclick="pickEmoji(this)">🐶</div>
          <div class="emoji-btn" data-e="✈️" onclick="pickEmoji(this)">✈️</div>
        </div>
      </div>
    </div>

    <button class="btn" id="submit-btn" type="submit">Sign in →</button>
  </form>

  <a href="/" class="back">← Back to home</a>
</div>

<script>
  let mode = 'login';
  let selectedEmoji = '😊';

  function setTab(t) {
    mode = t;
    document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active', (i===0&&t==='login')||(i===1&&t==='signup')));
    document.getElementById('signup-extra').style.display = t==='signup'?'block':'none';
    document.getElementById('submit-btn').textContent = t==='login'?'Sign in →':'Create account →';
    document.getElementById('name').required = t==='signup';
    document.getElementById('age').required = t==='signup';
    showErr('');
  }

  function pickEmoji(el) {
    document.querySelectorAll('.emoji-btn').forEach(e=>e.classList.remove('active'));
    el.classList.add('active');
    selectedEmoji = el.dataset.e;
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  async function submit(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '...';
    showErr('');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      let url, body;
      if (mode === 'login') {
        url = '/api/login';
        body = {email, password};
      } else {
        url = '/api/register';
        body = {
          email, password,
          name: document.getElementById('name').value,
          age: parseInt(document.getElementById('age').value) || 25,
          emoji: selectedEmoji,
        };
      }
      const r = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!r.ok) { showErr(d.detail || 'Something went wrong'); return; }
      localStorage.setItem('token', d.token);
      localStorage.setItem('user_id', d.user_id);
      window.location.href = '/app';
    } catch(err) {
      showErr('Network error. Is the server running?');
    } finally {
      btn.disabled = false;
      btn.textContent = mode==='login'?'Sign in →':'Create account →';
    }
  }

  // Auto-redirect if already logged in
  if (localStorage.getItem('token')) window.location.href = '/app';
</script>
</body>
</html>
