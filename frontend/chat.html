<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Proximity — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--pink:#ff6b9d;--purple:#a78bfa;--green:#34d399;--bg:#0a0118;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;}
  .topbar{background:rgba(10,1,24,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .back-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:8px 14px;color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;}
  .match-info{flex:1;}
  .match-name{font-size:16px;font-weight:700;}
  .match-dist{font-size:12px;color:var(--green);}
  .game-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:8px 14px;color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;}

  /* Messages area */
  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .bubble-row{display:flex;align-items:flex-end;gap:8px;}
  .bubble-row.mine{flex-direction:row-reverse;}
  .bubble{max-width:72%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4;}
  .bubble-row.mine .bubble{background:linear-gradient(135deg,var(--pink),var(--purple));border-bottom-right-radius:4px;}
  .bubble-row.theirs .bubble{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-bottom-left-radius:4px;}
  .bubble-time{font-size:10px;opacity:0.4;margin-bottom:4px;}
  .sender-emoji{font-size:24px;}
  .empty-chat{text-align:center;padding:60px 20px;opacity:0.4;}
  .empty-chat-icon{font-size:48px;margin-bottom:10px;}

  /* Input area */
  .input-area{padding:12px 16px max(16px,env(safe-area-inset-bottom));background:rgba(10,1,24,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}
  .input-area textarea{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:12px 16px;color:#fff;font-family:inherit;font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.4;}
  .input-area textarea:focus{border-color:var(--purple);}
  .send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="match-info">
    <div class="match-name" id="match-name">Loading...</div>
    <div class="match-dist" id="match-dist"></div>
  </div>
  <button class="game-btn" id="game-btn">🎮 Game</button>
</div>

<div class="messages" id="messages">
  <div class="empty-chat"><div class="empty-chat-icon">💬</div><p>Say something! They're nearby.</p></div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Say something..." rows="1" onkeydown="handleKey(event)"></textarea>
  <button class="send-btn" onclick="sendMsg()">↑</button>
</div>

<script>
  const token   = localStorage.getItem('token');
  const myId    = parseInt(localStorage.getItem('user_id'));
  if (!token) window.location.href = '/login';
  const headers = {'Content-Type':'application/json','Authorization':'Bearer '+token};
  const matchId = parseInt(location.pathname.split('/').pop());

  let matchData = null, ws = null, targetId = null;

  async function api(method, url, body) {
    const r = await fetch(url, {method, headers, body: body?JSON.stringify(body):undefined});
    return r.json();
  }

  function fmtTime(ts) {
    const d = new Date(ts*1000);
    return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }

  function renderMessages(msgs) {
    const container = document.getElementById('messages');
    if (!msgs.length) return;
    container.innerHTML = msgs.map(m => {
      const mine = m.sender_id === myId;
      return `
        <div class="bubble-row ${mine?'mine':'theirs'}">
          ${!mine?`<div class="sender-emoji">${m.emoji||'😊'}</div>`:''}
          <div>
            <div class="bubble-time" style="text-align:${mine?'right':'left'}">${fmtTime(m.ts)}</div>
            <div class="bubble">${m.body}</div>
          </div>
        </div>
      `;
    }).join('');
    container.scrollTop = container.scrollHeight;
  }

  function handleKey(e) {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  }

  async function sendMsg() {
    const input = document.getElementById('input');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    // Optimistic render
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'bubble-row mine';
    div.innerHTML = `<div><div class="bubble-time" style="text-align:right">${fmtTime(Date.now()/1000)}</div><div class="bubble">${body}</div></div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;

    // Send via WS for real-time
    if (ws?.readyState===1 && targetId) {
      ws.send(JSON.stringify({type:'chat',match_id:matchId,target_id:targetId,body}));
    }
    // Also persist via API
    api('POST','/api/messages',{match_id:matchId,body});
  }

  function connectWS() {
    const proto = location.protocol==='https:'?'wss':'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${myId}`);
    ws.onmessage = e => {
      const d = JSON.parse(e.data);
      if (d.type==='chat' && d.match_id===matchId) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'bubble-row theirs';
        div.innerHTML = `
          <div class="sender-emoji">${matchData?.user?.emoji||'😊'}</div>
          <div><div class="bubble-time">${fmtTime(d.ts)}</div><div class="bubble">${d.body}</div></div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
  }

  async function init() {
    try {
      const matches = await api('GET','/api/matches');
      matchData = matches.find(m=>m.match_id===matchId);
      if (matchData) {
        document.getElementById('match-name').textContent = `${matchData.user.emoji} ${matchData.user.name}`;
        document.getElementById('match-dist').textContent = '📍 '+matchData.user.distance;
        targetId = matchData.user.id;
        document.getElementById('game-btn').onclick = () => {
          const gid = [Math.min(myId,targetId),Math.max(myId,targetId)].join('-');
          window.location.href = `/game/${gid}?target=${targetId}`;
        };
      }
      const msgs = await api('GET',`/api/messages/${matchId}`);
      renderMessages(msgs);
      connectWS();
    } catch { localStorage.clear(); window.location.href='/login'; }
  }

  init();
</script>
</body>
</html>
